  /* =====================================================================
     PROGRESS
     ===================================================================== */
  function renderProgress(){
    var t = todayStr();
    var weekStart = startOfWeek(t);
    var days = [];
    for(var i=0;i<7;i++) days.push(addDays(weekStart,i));

    var perDay = days.map(function(d){
      return state.tasks.filter(function(x){ return x.completed && x.completedAt === d; }).length;
    });
    var maxDay = Math.max.apply(null, perDay.concat([1]));
    var weekTasks = perDay.reduce(function(a,b){ return a+b; }, 0);

    var dueThisWeek = state.tasks.filter(function(x){ return x.dueDate >= weekStart && x.dueDate <= addDays(weekStart,6); });
    var doneDueThisWeek = dueThisWeek.filter(function(x){ return x.completed; }).length;

    var rTot = 0, rDone = 0;
    days.forEach(function(d){
      state.routines.forEach(function(r){
        if(r.days.indexOf(dowIdx(d)) === -1) return;
        rTot += r.items.length;
        rDone += r.items.filter(function(it){ return isItemDone(d, r.id, it.id); }).length;
      });
    });

    var gAvg = goalProgressAvg();
    var goalsDone = state.goals.filter(function(g){ return goalProgress(g) === 100; }).length;

    var h = '<div class="page-head"><div class="page-title">Progress</div>' +
      '<div class="page-sub">A gentle look at your week — every step counts. All figures come from what you\u2019ve actually saved.</div></div>';

    h += '<div class="grid grid-3">' +
      statCard(weekTasks, "tasks completed this week") +
      statCard(pct(rDone, rTot) + "%", "routine steps ticked") +
      statCard(gAvg + "%", "average goal progress") +
    '</div>';

    h += '<div class="card" style="margin-top:16px"><div class="card-head"><div class="card-title"><span class="tick" style="background:var(--sky)"></span>Tasks completed each day</div>' +
      '<span class="small muted">This week</span></div>';
    h += '<div class="chart">';
    days.forEach(function(d, i){
      var v = perDay[i];
      var hp = Math.round(v / maxDay * 100);
      h += '<div class="col"><div class="stack" title="' + v + ' tasks"><i style="height:' + (v ? Math.max(hp,8) : 0) + '%"></i></div>' +
        '<div class="dl">' + DOW[i] + '</div></div>';
    });
    h += '</div>';
    if(weekTasks === 0){
      h += '<p class="small muted" style="margin:12px 0 0;text-align:center">No tasks completed yet this week. Whenever you tick one off, it will show up here.</p>';
    }
    h += '</div>';

    h += '<div class="card" style="margin-top:16px"><div class="card-head"><div class="card-title"><span class="tick"></span>Weekly summary</div></div>';
    var taskRate = pct(doneDueThisWeek, dueThisWeek.length);
    h += summaryRow("Tasks due this week", doneDueThisWeek + " of " + dueThisWeek.length + " complete", taskRate, "");
    var routineRate = pct(rDone, rTot);
    h += summaryRow("Routine steps", rDone + " of " + rTot + " ticked", routineRate, "lav");
    h += summaryRow("Goal progress", goalsDone + " of " + state.goals.length + " goals finished", gAvg, "sky");
    h += '</div>';

    var msg;
    if(weekTasks === 0 && rDone === 0){
      msg = "A fresh week. Pick one small task and start there — momentum builds quickly.";
    } else if(taskRate >= 70 || routineRate >= 70){
      msg = "You\u2019re doing brilliantly this week. Keep the flow going, and rest when you need to.";
    } else {
      msg = "Progress is progress, however small. You\u2019ve already taken " + (weekTasks + rDone) + " steps this week.";
    }
    h += '<div class="card" style="margin-top:16px;background:linear-gradient(120deg,var(--sage-soft),var(--sky-soft))">' +
      '<div style="display:flex;gap:12px;align-items:flex-start">' +
      '<div style="color:var(--forest)">' + icon("sparkle","22") + '</div>' +
      '<div><b style="font-size:14px">A note for you</b><p style="margin:4px 0 0;font-size:13.5px;color:#4A4741">' + esc(msg) + '</p></div>' +
      '</div></div>';

    return h;
  }
  function statCard(n, l){
    return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + esc(l) + '</div></div>';
  }
  function summaryRow(label, detail, percent, tone){
    return '<div style="margin-bottom:15px">' +
      '<div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:5px">' +
        '<span style="font-size:13.5px;font-weight:550">' + esc(label) + '</span>' +
        '<span class="small muted">' + esc(detail) + '</span></div>' +
      '<div class="bar ' + (tone||"") + '"><i style="width:' + percent + '%"></i></div></div>';
  }

  /* =====================================================================
     SETTINGS · BACKUP · FEEDBACK · SHARE · PRICING · PRIVACY
     ===================================================================== */
  function countsSummary(){
    return state.tasks.length + " tasks, " + state.routines.length + " routines, " +
      state.goals.length + " goals, " + state.lists.length + " lists";
  }
  function openSettings(){
    var storageText = storageOK
      ? "Saved in this browser only (" + countsSummary() + ")."
      : "Browser storage is blocked — changes last only for this session.";
    var body =
      '<div class="set-row"><div class="grow"><b>Where your data lives</b>' +
        '<div class="sub">' + esc(storageText) + ' DayFlow has no accounts and no cloud sync, so data does not follow you between devices or browsers.</div></div></div>' +
      '<div class="set-row"><div class="grow"><b>Back up or move your data</b>' +
        '<div class="sub">Export a backup file you can keep, or import one to restore. This is the safest way to move DayFlow to another device.</div>' +
        '<div class="set-actions">' +
          '<button type="button" class="btn btn-sm btn-soft" onclick="DF.exportData()">' + icon("download") + 'Export backup</button>' +
          '<button type="button" class="btn btn-sm btn-ghost" onclick="DF.importData()">' + icon("upload") + 'Import backup</button>' +
        '</div></div></div>' +
      '<div class="set-row"><div class="grow"><b>Dates &amp; time</b>' +
        '<div class="sub">DayFlow uses your device\u2019s local date and time zone. All dates are stored as plain calendar dates (no time-of-day), so planning stays correct wherever you are.</div></div></div>' +
      '<div class="set-row"><div class="grow"><b>Learn how DayFlow works</b>' +
        '<div class="sub">Replay the short welcome tour any time.</div>' +
        '<div class="set-actions"><button type="button" class="btn btn-sm btn-ghost" onclick="DF.closeModal();DF.startTour()">Replay welcome tour</button></div></div></div>' +
      '<div class="set-row"><div class="grow"><b>Help shape DayFlow</b>' +
        '<div class="sub">Send a bug report, an idea, or tell us what you\u2019d pay for. Feedback is optional and nothing is sent automatically.</div>' +
        '<div class="set-actions">' +
          '<button type="button" class="btn btn-sm btn-soft" onclick="DF.openFeedback()">' + icon("heart") + 'Send feedback</button>' +
          '<button type="button" class="btn btn-sm btn-ghost" onclick="DF.shareApp()">' + icon("share") + 'Share DayFlow</button>' +
        '</div></div></div>' +
      '<div class="set-row"><div class="grow"><b>Plans</b>' +
        '<div class="sub">See what\u2019s free now and what\u2019s planned for DayFlow Plus.</div>' +
        '<div class="set-actions">' +
          '<button type="button" class="btn btn-sm btn-ghost" onclick="DF.openPricing()">View plans</button>' +
          '<button type="button" class="btn btn-sm btn-ghost" onclick="DF.openPrivacy()">Privacy</button>' +
        '</div></div></div>' +
      '<div class="set-row"><div class="grow"><b>About</b>' +
        '<div class="sub">DayFlow v' + APP_VERSION + ' · single-file app · no external services.</div></div></div>' +
      '<div class="danger"><b style="font-size:14px">Reset DayFlow</b>' +
        '<div class="sub" style="margin:4px 0 10px">Delete all tasks, routines, goals and lists on this device. Export a backup first if you might want them back.</div>' +
        '<button type="button" class="btn btn-sm btn-danger-soft" onclick="DF.resetAll()">Delete all data</button></div>';
    openModal("Settings & backup", body, null, null, { wide:true, cancelLabel:"Close" });
  }

  function exportData(){
    try{
      var data = JSON.stringify(state, null, 2);
      var blob = new Blob([data], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "dayflow-backup-" + todayStr() + ".json";
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
      toast("Backup downloaded");
    }catch(e){ toast("Couldn't create the backup file", true); }
  }
  function importData(){
    var inp = document.getElementById("importFile");
    if(!inp) return;
    inp.value = "";
    inp.onchange = function(){
      var file = inp.files && inp.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        var d;
        try{ d = JSON.parse(reader.result); }
        catch(e){ toast("That file isn\u2019t valid DayFlow data", true); return; }
        if(!d || typeof d !== "object" || (!d.tasks && !d.routines && !d.goals && !d.lists)){
          toast("That file isn\u2019t a DayFlow backup", true); return;
        }
        if(!confirm("Replace all current DayFlow data with this backup?")) return;
        applyState(d);
        state.bannerDismissed = true;
        var r = save(); render();
        toast(r === "error" ? "Couldn't save the imported backup" : "Backup restored", r === "error");
      };
      reader.onerror = function(){ toast("Couldn't read that file", true); };
      reader.readAsText(file);
    };
    inp.click();
  }
  function resetAll(){
    if(!confirm("Delete ALL DayFlow data on this device? This cannot be undone.")) return;
    state = blankState();
    state.onboarded = true;
    state.bannerDismissed = true;
    var r = save(); render();
    toast(r === "error" ? "Couldn't clear data" : "All data cleared", r === "error");
  }

  function openPricing(){
    var check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5 11-11"/></svg>';
    var body =
      '<p class="small muted" style="margin:0 0 14px">DayFlow is free to use today. DayFlow Plus is a <b>plan</b> — nothing below is for sale yet and no payment can be taken in the app.</p>' +
      '<div class="plans">' +
        '<div class="plan"><h4>Free</h4><div class="price">£0</div><div class="small muted">Available now</div><ul>' +
          '<li>' + check + 'Today dashboard &amp; quick add</li>' +
          '<li>' + check + 'Tasks with due dates &amp; priorities</li>' +
          '<li>' + check + 'Day &amp; week planner</li>' +
          '<li>' + check + 'Routines with per-day tracking</li>' +
          '<li>' + check + 'Goals with steps</li>' +
          '<li>' + check + 'Unlimited custom lists</li>' +
          '<li>' + check + 'Basic weekly progress</li>' +
          '<li>' + check + 'Local backup export &amp; import</li>' +
        '</ul></div>' +
        '<div class="plan plus"><h4>DayFlow Plus <span class="badge-planned">Planned</span></h4>' +
          '<div class="price">TBD</div><div class="small muted">Not available yet — nothing to buy</div><ul>' +
          '<li class="planned">' + check + 'Cloud sync across devices <span class="badge-planned" style="margin-left:6px">Planned</span></li>' +
          '<li class="planned">' + check + 'Advanced planning &amp; calendar views <span class="badge-planned" style="margin-left:6px">Planned</span></li>' +
          '<li class="planned">' + check + 'Deeper progress insights &amp; trends <span class="badge-planned" style="margin-left:6px">Planned</span></li>' +
          '<li class="planned">' + check + 'Themes &amp; customisation <span class="badge-planned" style="margin-left:6px">Planned</span></li>' +
        '</ul></div>' +
      '</div>' +
      '<div class="banner" style="margin:16px 0 0"><span class="grow"><b>Why no paywall yet?</b> Paid features will only ship once they genuinely exist and payment is set up securely. The free version is the real product for now.</span></div>';
    openModal("Plans", body, null, null, { wide:true, cancelLabel:"Close" });
  }

  function openPrivacy(){
    var body =
      '<p style="margin-top:0">DayFlow is designed to collect as little as possible.</p>' +
      '<ul style="padding-left:18px;font-size:13.5px;line-height:1.7">' +
        '<li><b>No accounts.</b> You don\u2019t sign up, so we hold no personal profile.</li>' +
        '<li><b>No tracking.</b> No analytics scripts, cookies, pixels or third-party services are loaded by the app.</li>' +
        '<li><b>Your data stays on your device.</b> Tasks, routines, goals and lists are saved in your browser\u2019s local storage on this device only.</li>' +
        '<li><b>Feedback is voluntary.</b> Nothing is sent automatically — the feedback form only opens your own email app or copies text for you to send.</li>' +
        '<li><b>You\u2019re in control.</b> Export a backup or delete everything from Settings at any time.</li>' +
      '</ul>' +
      '<p class="small muted">Because data is stored locally, clearing your browser data will remove it. Keep a backup via Settings if it matters to you.</p>';
    openModal("Privacy", body, null, null, { cancelLabel:"Close" });
  }

  function openFeedback(){
    var emailConfigured = CONTACT_EMAIL.indexOf("example") === -1;
    var body =
      '<p class="small muted" style="margin-top:0">Optional and short. Nothing is sent automatically — this ' +
        (emailConfigured ? 'opens your email app with the message ready to send.' : 'copies your message so you can send it yourself.') + '</p>' +
      '<label class="fld"><span>What is this about?</span><select name="fbType">' +
        '<option>Bug report</option><option>Feature suggestion</option>' +
        '<option>What I use most</option><option>Would I pay for this?</option><option>Other</option>' +
      '</select></label>' +
      '<label class="fld"><span>Your message</span><textarea name="fbMsg" maxlength="1500" placeholder="Tell us what happened or what you\u2019d like to see" required></textarea></label>' +
      '<label class="fld"><span>Email <span class="muted">(optional — only if you want a reply)</span></span>' +
        '<input type="email" name="fbEmail" maxlength="120" placeholder="you@example.com"></label>' +
      '<div class="fld"><span>Would you consider paying for any of these? <span class="muted">(optional)</span></span>' +
        '<label class="check-line"><input type="checkbox" name="wants" value="Cloud sync across devices"> Cloud sync across devices</label>' +
        '<label class="check-line"><input type="checkbox" name="wants" value="Advanced planning / calendar views"> Advanced planning &amp; calendar views</label>' +
        '<label class="check-line"><input type="checkbox" name="wants" value="Deeper progress insights"> Deeper progress insights</label>' +
        '<label class="check-line"><input type="checkbox" name="wants" value="Themes and customisation"> Themes &amp; customisation</label>' +
      '</div>';
    openModal("Send feedback", body, emailConfigured ? "Open email app" : "Copy feedback", function(f){
      var msg = f.elements.fbMsg.value.trim();
      if(!msg){ f.elements.fbMsg.focus(); toast("Please add a short message", true); return; }
      var wants = [];
      f.querySelectorAll("input[name=wants]:checked").forEach(function(c){ wants.push(c.value); });
      var email = f.elements.fbEmail.value.trim();
      var text = "DayFlow feedback\n\nType: " + f.elements.fbType.value +
        "\n\nMessage:\n" + msg +
        "\n\nInterested in (paid features): " + (wants.length ? wants.join(", ") : "none") +
        "\nReply to: " + (email || "(not provided)") +
        "\n\nApp version: " + APP_VERSION + "\nSent: " + new Date().toLocaleString();
      if(emailConfigured){
        window.location.href = "mailto:" + CONTACT_EMAIL +
          "?subject=" + encodeURIComponent("DayFlow feedback: " + f.elements.fbType.value) +
          "&body=" + encodeURIComponent(text);
        closeModal(); toast("Opening your email app\u2026");
      } else {
        copyText(text, "Feedback copied — paste it to send it to the DayFlow team");
        closeModal();
      }
    });
  }

  function shareApp(){
    var url = window.location.href.split("?")[0].split("#")[0];
    if(navigator.share){
      navigator.share({ title:"DayFlow", text:"A calm, simple planner for your day.", url: url }).catch(function(){});
    } else {
      copyText(url, "Link copied — share it with someone who\u2019d like to test DayFlow");
    }
  }

  /* =====================================================================
     ONBOARDING
     ===================================================================== */
  function welcomeHtml(){
    return '' +
      '<div class="welcome-hero">' +
        '<div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 8-8"/><path d="M4 4v5h5"/><path d="M12 8v4l3 2"/></svg></div>' +
        '<h2>Welcome to DayFlow</h2>' +
        '<p>Your day, organised around your life. Plan tasks, build routines, track goals and keep your lists — all in one calm place.</p>' +
      '</div>' +
      '<div class="welcome-body">' +
        '<div class="tour-point"><div class="num">1</div><div><b>Plan your day</b><p>Add tasks with a due date and priority, then tick them off as you go.</p></div></div>' +
        '<div class="tour-point"><div class="num">2</div><div><b>Build routines</b><p>Create morning or evening routines that repeat on the days you choose.</p></div></div>' +
        '<div class="tour-point"><div class="num">3</div><div><b>Grow goals &amp; lists</b><p>Break goals into steps and keep any kind of list you like.</p></div></div>' +
      '</div>' +
      '<div class="welcome-foot">' +
        '<button class="btn btn-primary btn-block" onclick="DF.finishOnboarding(\'task\')">Add my first task</button>' +
        '<button class="btn btn-ghost btn-block" onclick="DF.finishOnboarding(\'sample\')">Explore with example content</button>' +
        '<button class="btn btn-ghost btn-block" onclick="DF.finishOnboarding(\'empty\')">Start with an empty app</button>' +
      '</div>';
  }
  function showWelcome(){
    if(EMBED) return;
    document.getElementById("welcomeCard").innerHTML = welcomeHtml();
    document.getElementById("welcome").classList.add("open");
  }
  function hideWelcome(){ document.getElementById("welcome").classList.remove("open"); }
  function startTour(){ showWelcome(); }
  function finishOnboarding(mode){
    state.onboarded = true;
    if(mode === "empty"){ removeExamples(true); }
    if(mode === "sample"){ if(!hasExamples()) seed(); state.bannerDismissed = false; }
    hideWelcome();
    save(); render();
    if(mode === "task"){ addTask(todayStr()); }
    else toast("You\u2019re all set");
  }

  /* =====================================================================
     RENDER
     ===================================================================== */
  function render(){
    renderNav();
    var view = document.getElementById("view");
    if(ui.tab === "today") view.innerHTML = renderToday();
    else if(ui.tab === "planner") view.innerHTML = renderPlanner();
    else if(ui.tab === "routines") view.innerHTML = renderRoutines();
    else if(ui.tab === "goals") view.innerHTML = renderGoals();
    else if(ui.tab === "lists") view.innerHTML = renderLists();
    else if(ui.tab === "progress") view.innerHTML = renderProgress();
  }

  /* ---------- Expose handlers ---------- */
  window.DF = {
    go: go, closeModal: closeModal, toast: toast,
    addTask: addTask, editTask: editTask, toggleTask: toggleTask, deleteTask: deleteTask, moveTask: moveTask,
    quickAddTask: quickAddTask, moveUnfinishedToTomorrow: moveUnfinishedToTomorrow,
    clearExamples: clearExamples, dismissBanner: dismissBanner,
    setPlannerMode: setPlannerMode, selectDay: selectDay, gotoToday: gotoToday, shiftWeek: shiftWeek,
    addRoutine: addRoutine, editRoutine: editRoutine, deleteRoutine: deleteRoutine,
    toggleRoutineItem: toggleRoutineItem, reorderRoutineItem: reorderRoutineItem,
    pickDay: pickDay, addEditorItem: addEditorItem, moveEditorItem: moveEditorItem, removeEditorItem: removeEditorItem,
    addGoal: addGoal, editGoal: editGoal, deleteGoal: deleteGoal,
    toggleStep: toggleStep, addStep: addStep, editStep: editStep, deleteStep: deleteStep,
    addList: addList, renameList: renameList, deleteList: deleteList,
    toggleListItem: toggleListItem, addListItem: addListItem, editListItem: editListItem,
    deleteListItem: deleteListItem, reorderListItem: reorderListItem,
    openSettings: openSettings, exportData: exportData, importData: importData, resetAll: resetAll,
    openPricing: openPricing, openPrivacy: openPrivacy, openFeedback: openFeedback, shareApp: shareApp,
    showWelcome: showWelcome, startTour: startTour, finishOnboarding: finishOnboarding
  };

  /* ---------- Boot ---------- */
  function boot(){
    var saved = loadRaw();
    if(saved && typeof saved === "object"){
      applyState(saved);
    } else {
      seed();
    }
    save(); // persist migrations and first-run seed immediately
    if(!storageOK){
      setTimeout(function(){ toast("Storage is unavailable — changes last only for this session", true); }, 700);
    }
    render();
    if(!state.onboarded) showWelcome();
  }
  boot();
})();
</script>
</body>
</html>
